<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>국내 하천 범람 위험 지도 (테스트)</title>
  <!-- 네이버 지도 API를 쓰려면 아래 주석을 풀고 YOUR_CLIENT_ID 자리에 발급받은 ID를 넣으세요 -->
  <!-- <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=YOUR_CLIENT_ID"></script> -->
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: #eef3f8;
    }
    .layout { display: flex; width: 100%; height: 100%; }
    .sidebar {
      width: 360px; max-width: 100%; background: #fff;
      border-right: 1px solid #e2e8f0; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.06); z-index: 10;
    }
    .title { font-size: 18px; font-weight: 700; color: #0f172a; margin: 0; }
    .subtitle { font-size: 13px; color: #64748b; margin: 4px 0 0; }
    .search-row { display: flex; gap: 8px; }
    input {
      flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 14px; outline: none;
    }
    input:focus { border-color: #03c75a; }
    button {
      padding: 10px 16px; border: none; border-radius: 8px;
      background: #03c75a; color: #fff; font-weight: 600;
      font-size: 14px; cursor: pointer;
    }
    button:hover { background: #02b350; }
    .quick-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      padding: 5px 10px; border-radius: 999px; font-size: 12px;
      background: #f1f5f9; color: #334155; cursor: pointer; border: 1px solid #e2e8f0;
    }
    .tag:hover { background: #e2e8f0; }
    .card {
      border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px;
      background: #f8fafc; font-size: 14px; line-height: 1.6;
    }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      color: #fff; font-weight: 700; font-size: 12px; margin-left: 6px;
    }
    .map-area {
      flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #f8fafc 0%, #dbeafe 100%);
      padding: 24px;
    }
    .map-placeholder {
      background: #fff; border: 1px solid #cbd5e1; border-radius: 16px;
      padding: 28px; max-width: 480px; text-align: center;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }
    .coord-box {
      margin-top: 14px; padding: 12px; border-radius: 8px;
      background: #f1f5f9; font-family: monospace; font-size: 13px; color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div>
        <h1 class="title">국내 하천 범람 위험 지도</h1>
        <p class="subtitle">하천 이름을 검색해 범람 가능성과 지표를 확인하세요.</p>
      </div>

      <div class="search-row">
        <input id="riverInput" type="text" placeholder="하천명 입력 (예: 한강, 낙동강)" onkeydown="if(event.key==='Enter') searchRiver()" />
        <button onclick="searchRiver()">검색</button>
      </div>

      <div class="quick-tags">
        <span class="tag" onclick="selectByName('한강')">한강</span>
        <span class="tag" onclick="selectByName('낙동강')">낙동강</span>
        <span class="tag" onclick="selectByName('금강')">금강</span>
        <span class="tag" onclick="selectByName('영산강')">영산강</span>
        <span class="tag" onclick="selectByName('섬진강')">섬진강</span>
      </div>

      <div id="resultCard" class="card">
        왼쪽 검색창에 하천 이름을 입력하거나 위 버튼(한강, 낙동강 등)을 눌러보세요.
      </div>
    </aside>

    <main id="map" class="map-area">
      <div class="map-placeholder" id="mapStatus">
        <h3 style="margin-top:0;">지도 미리보기 영역</h3>
        <p style="font-size:14px; color:#475569; line-height:1.6;">
          하천을 검색하면 해당 하천의 중심 좌표와 범람 위험 반경이 여기에 표시됩니다.<br/>
          (추후 네이버 클라우드 Client ID를 연결하면 실제 네이버 지도가 뜹니다.)
        </p>
        <div class="coord-box" id="coordDisplay">선택된 하천 없음</div>
      </div>
    </main>
  </div>

  <script>
    const rivers = [
      { name: "한강", basin: "한강권역", lat: 37.528, lng: 126.934, riverbedCoeff: 390, rainfallMm: 85, waterLevelRatio: 0.72 },
      { name: "낙동강", basin: "낙동강권역", lat: 35.179, lng: 128.950, riverbedCoeff: 370, rainfallMm: 42, waterLevelRatio: 0.45 },
      { name: "금강", basin: "금강권역", lat: 36.012, lng: 126.735, riverbedCoeff: 300, rainfallMm: 110, waterLevelRatio: 0.81 },
      { name: "영산강", basin: "영산강권역", lat: 34.978, lng: 126.512, riverbedCoeff: 320, rainfallMm: 25, waterLevelRatio: 0.35 },
      { name: "섬진강", basin: "섬진강권역", lat: 35.192, lng: 127.625, riverbedCoeff: 390, rainfallMm: 135, waterLevelRatio: 0.88 }
    ];

    function calcRisk(r) {
      const rainScore = Math.min(r.rainfallMm / 150, 1) * 45;
      const coeffScore = Math.min(r.riverbedCoeff / 500, 1) * 25;
      const levelScore = Math.min(r.waterLevelRatio, 1) * 30;
      const score = Math.round((rainScore + coeffScore + levelScore) * 10) / 10;

      if (score >= 75) return { score, level: "심각", color: "#dc2626" };
      if (score >= 50) return { score, level: "경계", color: "#ea580c" };
      if (score >= 25) return { score, level: "주의", color: "#d97706" };
      return { score, level: "안전", color: "#16a34a" };
    }

    function selectByName(name) {
      document.getElementById("riverInput").value = name;
      searchRiver();
    }

    function searchRiver() {
      const keyword = document.getElementById("riverInput").value.trim();
      const card = document.getElementById("resultCard");
      const coordDisplay = document.getElementById("coordDisplay");

      if (!keyword) {
        card.innerHTML = "하천 이름을 먼저 입력해 주세요.";
        return;
      }

      const found = rivers.find(r => r.name.includes(keyword));
      if (!found) {
        card.innerHTML = `"<b>${keyword}</b>" 하천 데이터를 찾지 못했습니다.`;
        return;
      }

      const risk = calcRisk(found);

      card.innerHTML = `
        <div style="font-size:17px; font-weight:700; margin-bottom:8px;">
          ${found.name} <span style="font-size:13px; color:#64748b; font-weight:400;">(${found.basin})</span>
          <span class="badge" style="background:${risk.color}">${risk.level} (${risk.score}점)</span>
        </div>
        <div>• <b>하상계수:</b> ${found.riverbedCoeff}</div>
        <div>• <b>최근 강수량:</b> ${found.rainfallMm} mm</div>
        <div>• <b>제방 수위 비율:</b> ${Math.round(found.waterLevelRatio * 100)}%</div>
        <div>• <b>중심 좌표:</b> 위도 ${found.lat}, 경도 ${found.lng}</div>
      `;

      coordDisplay.innerHTML = `
        [지도 이동 완료] <b>${found.name}</b><br/>
        중심 좌표: (${found.lat}, ${found.lng})<br/>
        위험 등급: <span style="color:${risk.color}; font-weight:700;">${risk.level} (${risk.score}점)</span>
      `;
    }
  </script>
</body>
</html>
