<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대한민국 하천 범람 위험 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      overflow: hidden; background: #f8fafc;
    }
    .app-container { display: flex; width: 100%; height: 100%; position: relative; }

    /* 네이버 지도 스타일 왼쪽 플로팅/사이드 패널 */
    .sidebar {
      width: 380px; max-width: 100%; height: 100%;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex; flex-direction: column;
      box-shadow: 4px 0 16px rgba(15, 23, 42, 0.08);
      z-index: 1000;
    }
    .header-box {
      padding: 18px 20px 14px;
      background: #03c75a;
      color: #ffffff;
    }
    .header-box h1 {
      margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.3px;
    }
    .header-box p {
      margin: 4px 0 0; font-size: 12px; opacity: 0.92;
    }

    .search-section {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
      background: #fff;
      position: relative;
    }
    .search-bar {
      display: flex; align-items: center;
      border: 2px solid #03c75a; border-radius: 8px;
      overflow: hidden; background: #fff;
    }
    .search-bar input {
      flex: 1; border: none; padding: 10px 12px;
      font-size: 14px; outline: none; color: #0f172a;
    }
    .search-bar button {
      background: #03c75a; color: #fff; border: none;
      padding: 10px 16px; font-weight: 700; font-size: 14px;
      cursor: pointer; transition: background 0.15s;
    }
    .search-bar button:hover { background: #02b350; }

    .autocomplete-list {
      position: absolute; left: 16px; right: 16px; top: 60px;
      background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      max-height: 220px; overflow-y: auto; z-index: 2000;
      display: none;
    }
    .autocomplete-item {
      padding: 9px 12px; font-size: 13px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #f1f5f9;
    }
    .autocomplete-item:hover { background: #f0fdf4; }

    .filter-tabs {
      display: flex; gap: 6px; padding: 10px 16px;
      border-bottom: 1px solid #f1f5f9; overflow-x: auto;
      background: #fafafa;
    }
    .tab-btn {
      padding: 5px 10px; border-radius: 999px; font-size: 12px;
      border: 1px solid #e2e8f0; background: #fff; color: #475569;
      cursor: pointer; white-space: nowrap; font-weight: 600;
    }
    .tab-btn.active {
      background: #0f172a; color: #fff; border-color: #0f172a;
    }

    .content-scroll {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
    }

    .detail-card {
      border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 16px; background: #f8fafc;
    }
    .river-title-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .river-name { font-size: 18px; font-weight: 800; color: #0f172a; }
    .river-basin { font-size: 12px; color: #64748b; margin-left: 4px; font-weight: 500; }
    .risk-badge {
      padding: 4px 10px; border-radius: 999px;
      color: #fff; font-size: 12px; font-weight: 700;
    }

    .metric-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-top: 10px;
    }
    .metric-box {
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 8px; padding: 10px;
    }
    .metric-label { font-size: 11px; color: #64748b; margin-bottom: 3px; }
    .metric-val { font-size: 15px; font-weight: 700; color: #0f172a; }

    .sim-box {
      margin-top: 12px; padding-top: 12px;
      border-top: 1px dashed #cbd5e1;
    }
    .sim-box label {
      display: flex; justify-content: space-between;
      font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;
    }
    .sim-box input[type="range"] { width: 100%; accent-color: #03c75a; cursor: pointer; }

    .river-list-title {
      font-size: 12px; font-weight: 700; color: #64748b;
      margin: 4px 0 6px;
    }
    .river-list { display: flex; flex-direction: column; gap: 6px; }
    .river-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
      background: #fff; cursor: pointer; transition: all 0.12s;
    }
    .river-row:hover { border-color: #03c75a; background: #f0fdf4; }

    .legend-footer {
      padding: 10px 16px; border-top: 1px solid #e2e8f0;
      background: #fff; font-size: 11px; color: #475569;
      display: flex; justify-content: space-between;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    #map { flex: 1; height: 100%; z-index: 1; }

    /* 지도 우측 상단 컨트롤 버튼 */
    .map-controls {
      position: absolute; top: 16px; right: 16px; z-index: 900;
      display: flex; flex-direction: column; gap: 8px;
    }
    .map-ctrl-btn {
      background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
      padding: 8px 12px; font-size: 12px; font-weight: 700; color: #1e293b;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12); cursor: pointer;
    }
    .map-ctrl-btn:hover { background: #f8fafc; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .sidebar { width: 100%; height: 48%; border-right: none; border-bottom: 1px solid #e2e8f0; }
      #map { height: 52%; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="header-box">
        <h1>국내 하천 범람 위험 지도</h1>
        <p>하상계수 · 강수량 · 제방 수위 기반 실시간 위험도 분석</p>
      </div>

      <div class="search-section">
        <div class="search-bar">
          <input id="riverInput" type="text" placeholder="하천명 검색 (예: 한강, 낙동강, 중랑천...)" autocomplete="off"
                 oninput="handleAutocomplete()" onkeydown="if(event.key==='Enter') searchRiver()" />
          <button onclick="searchRiver()">검색</button>
        </div>
        <div id="autocompleteList" class="autocomplete-list"></div>
      </div>

      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterBasin('전체', this)">전체 (32)</button>
        <button class="tab-btn" onclick="filterBasin('한강권역', this)">한강권역</button>
        <button class="tab-btn" onclick="filterBasin('낙동강권역', this)">낙동강권역</button>
        <button class="tab-btn" onclick="filterBasin('금강권역', this)">금강권역</button>
        <button class="tab-btn" onclick="filterBasin('영산강권역', this)">영산강권역</button>
        <button class="tab-btn" onclick="filterBasin('섬진강권역', this)">섬진강권역</button>
      </div>

      <div class="content-scroll">
        <div id="detailCard" class="detail-card">
          <div style="font-size:14px; font-weight:700; color:#0f172a; margin-bottom:4px;">
            하천을 검색하거나 목록에서 선택하세요
          </div>
          <div style="font-size:12px; color:#64748b; line-height:1.5;">
            하천명을 입력하면 지도에서 해당 하천 위치로 이동하고, 하상계수와 강수량을 반영한 범람 위험 반경을 표시합니다.
          </div>
        </div>

        <div>
          <div class="river-list-title" id="listTitle">주요 국가·지방하천 목록</div>
          <div id="riverList" class="river-list"></div>
        </div>
      </div>

      <div class="legend-footer">
        <span class="legend-item"><span class="dot" style="background:#16a34a"></span>안전(&lt;25)</span>
        <span class="legend-item"><span class="dot" style="background:#d97706"></span>주의(25~49)</span>
        <span class="legend-item"><span class="dot" style="background:#ea580c"></span>경계(50~74)</span>
        <span class="legend-item"><span class="dot" style="background:#dc2626"></span>심각(75+)</span>
      </div>
    </aside>

    <main id="map"></main>

    <div class="map-controls">
      <button class="map-ctrl-btn" onclick="resetMapView()">전국 전체보기</button>
    </div>
  </div>

  <script>
    // 국내 주요 국가하천 및 도심 주요 지방하천 데이터 (하상계수, 기준 강수량, 제방 수위비율, 하천 경로 좌표)

      { name: "낙동강", basin: "낙동강권역", region: "경북·경남·부산", lat: 35.350, lng: 128.750, coeff: 370, rain: 48, level: 0.48,

        path: [[35.960, 128.920], [35.910, 128.760], [35.895, 128.615], [35.845, 128.485]] },
      { name: "남강", basin: "낙동강권역", region: "경남 진주·의령", lat: 35.195, lng: 128.115, coeff: 385, rain: 105, level: 0.78,
        path: [[35.220, 127.850], [35.195, 128.115], [35.245, 128.320], [35.385, 128.480]] },
      { name: "황강", basin: "낙동강권역", region: "경남 합천·거창", lat: 35.565, lng: 128.165, coeff: 365, rain: 64, level: 0.54,

      { name: "태화강", basin: "낙동강권역", region: "울산", lat: 35.545, lng: 129.315, coeff: 415, rain: 112, level: 0.80,

      { name: "만경강", basin: "금강권역", region: "전북 전주·익산", lat: 35.895, lng: 126.985, coeff: 355, rain: 78, level: 0.66,

        path: [[35.480, 127.260], [35.320, 127.450], [35.192, 127.625], [35.040, 127.760]] },
      { name: "보성강", basin: "섬진강권역", region: "전남 보성·곡성", lat: 35.085, lng: 127.285, coeff: 365, rain: 96, level: 0.75,
        path: [[34.860, 127.120], [34.980, 127.210], [35.085, 127.285], [35.185, 127.365]] }
    ];

    // 지도 초기화
    const map = L.map('map', { zoomControl: false }).setView([36.35, 127.85], 7);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let currentBasin = "전체";
    let selectedRiver = null;
    let simulatedRain = null;
    let activeHighlightGroup = L.layerGroup().addTo(map);
    let baseLinesGroup = L.layerGroup().addTo(map);

    function calcRisk(river, overrideRain = null) {
      const rain = overrideRain !== null ? overrideRain : river.rain;
      // 강수량(45%) + 하상계수(25%) + 제방 수위비율(30%)
      const rainScore = Math.min(rain / 150, 1) * 45;
      const coeffScore = Math.min(river.coeff / 500, 1) * 25;
      const adjustedLevel = Math.min(river.level * (rain / Math.max(river.rain, 1)), 1.0);
      const levelScore = Math.min(overrideRain !== null ? adjustedLevel : river.level, 1) * 30;
      const score = Math.round((rainScore + coeffScore + levelScore) * 10) / 10;

      if (score >= 75) return { score, level: "심각", color: "#dc2626", rain };
      if (score >= 50) return { score, level: "경계", color: "#ea580c", rain };
      if (score >= 25) return { score, level: "주의", color: "#d97706", rain };
      return { score, level: "안전", color: "#16a34a", rain };
    }

    function drawBaseRivers() {
      baseLinesGroup.clearLayers();
      RIVERS_DATA.forEach(r => {
        const risk = calcRisk(r);
        const line = L.polyline(r.path, {
          color: risk.color,
          weight: 5,
          opacity: 0.72
        }).addTo(baseLinesGroup);

        line.bindTooltip(`${r.name} (${risk.level} · ${risk.score}점)`, { sticky: true });
        line.on('click', () => selectRiver(r));
      });
    }

    function renderRiverList() {
      const listEl = document.getElementById("riverList");
      const titleEl = document.getElementById("listTitle");
      const filtered = currentBasin === "전체"
        ? RIVERS_DATA
        : RIVERS_DATA.filter(r => r.basin === currentBasin);

      titleEl.textContent = `${currentBasin} 하천 목록 (${filtered.length}개)`;
      listEl.innerHTML = filtered.map(r => {
        const risk = calcRisk(r);
        return `
          <div class="river-row" onclick="selectRiverByName('${r.name}')">
            <div>
              <div style="font-weight:700; font-size:14px; color:#0f172a;">${r.name}</div>
              <div style="font-size:11px; color:#64748b;">${r.region} · 하상계수 ${r.coeff}</div>
            </div>
            <span class="risk-badge" style="background:${risk.color}">${risk.level} ${risk.score}</span>
          </div>
        `;
      }).join("");
    }

    function filterBasin(basin, btn) {
      currentBasin = basin;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderRiverList();
    }

    function handleAutocomplete() {
      const val = document.getElementById("riverInput").value.trim();
      const box = document.getElementById("autocompleteList");
      if (!val) {
        box.style.display = "none";
        return;
      }
      const matches = RIVERS_DATA.filter(r => r.name.includes(val) || r.region.includes(val));
      if (matches.length === 0) {
        box.style.display = "none";
        return;
      }
      box.innerHTML = matches.map(r => {
        const risk = calcRisk(r);
        return `
          <div class="autocomplete-item" onclick="selectRiverByName('${r.name}')">
            <span><b>${r.name}</b> <small style="color:#64748b;">(${r.region})</small></span>
            <span style="color:${risk.color}; font-weight:700; font-size:12px;">${risk.level}</span>
          </div>
        `;
      }).join("");
      box.style.display = "block";
    }

    function searchRiver() {
      const keyword = document.getElementById("riverInput").value.trim();
      document.getElementById("autocompleteList").style.display = "none";
      if (!keyword) return;

      const exact = RIVERS_DATA.find(r => r.name === keyword);
      const partial = RIVERS_DATA.find(r => r.name.includes(keyword) || r.region.includes(keyword));
      const target = exact || partial;

      if (!target) {
        document.getElementById("detailCard").innerHTML = `
          <div style="color:#dc2626; font-weight:700;">"${keyword}" 하천을 찾을 수 없습니다.</div>
          <div style="font-size:12px; color:#64748b; margin-top:4px;">한강, 낙동강, 금강, 영산강, 섬진강, 안양천, 중랑천, 미호강 등을 검색해 보세요.</div>
        `;
        return;
      }
      selectRiver(target);
    }

    function selectRiverByName(name) {
      const found = RIVERS_DATA.find(r => r.name === name);
      if (found) {
        document.getElementById("riverInput").value = found.name;
        document.getElementById("autocompleteList").style.display = "none";
        selectRiver(found);
      }
    }

    function selectRiver(river, overrideRain = null) {
      selectedRiver = river;
      simulatedRain = overrideRain !== null ? overrideRain : river.rain;
      const risk = calcRisk(river, simulatedRain);

      activeHighlightGroup.clearLayers();

      if (overrideRain === null) {
        map.flyTo([river.lat, river.lng], 11, { duration: 0.9 });
      }

      // 선택 하천 굵은 강조선
      L.polyline(river.path, {
        color: risk.color,
        weight: 9,
        opacity: 1
      }).addTo(activeHighlightGroup);

      // 범람 예상 영향 반경 표시
      L.circle([river.lat, river.lng], {
        radius: Math.max(1200, risk.score * 45),
        color: risk.color,
        fillColor: risk.color,
        fillOpacity: 0.24,
        weight: 2
      }).addTo(activeHighlightGroup);

      // 지도 팝업
      L.popup({ closeButton: false })
        .setLatLng([river.lat, river.lng])
        .setContent(`
          <div style="font-family:sans-serif; min-width:170px; line-height:1.5;">
            <div style="font-size:14px; font-weight:800;">${river.name} <span style="font-size:11px; color:#64748b;">(${river.basin})</span></div>
            <div>범람 위험: <b style="color:${risk.color}">${risk.level} (${risk.score}점)</b></div>
            <div style="font-size:12px; color:#334155;">하상계수 ${river.coeff} · 강수량 ${risk.rain}mm</div>
          </div>
        `)
        .openOn(map);

      // 상세 패널 업데이트 + 강수량 시뮬레이터 슬라이더
      document.getElementById("detailCard").innerHTML = `
        <div class="river-title-row">
          <div>
            <span class="river-name">${river.name}</span>
            <span class="river-basin">${river.basin}</span>
          </div>
          <span class="risk-badge" style="background:${risk.color}">${risk.level} (${risk.score}점)</span>
        </div>
        <div style="font-size:12px; color:#475569;">유역 위치: <b>${river.region}</b></div>

        <div class="metric-grid">
          <div class="metric-box">
            <div class="metric-label">하상계수 (유량변동)</div>
            <div class="metric-val">${river.coeff}</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">적용 강수량</div>
            <div class="metric-val" style="color:#03c75a;">${risk.rain} mm</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">제방 수위 도달률</div>
            <div class="metric-val">${Math.round(Math.min(river.level * (risk.rain / river.rain), 1) * 100)}%</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">중심 좌표</div>
            <div class="metric-val" style="font-size:12px;">${river.lat}, ${river.lng}</div>
          </div>
        </div>

        <div class="sim-box">
          <label>
            <span>강수량 변화 시뮬레이션</span>
            <span>${risk.rain} mm</span>
          </label>
          <input type="range" min="0" max="200" value="${risk.rain}"
                 oninput="selectRiver(selectedRiver, Number(this.value))" />
        </div>
      `;
    }

    function resetMapView() {
      activeHighlightGroup.clearLayers();
      map.closePopup();
      map.flyTo([36.35, 127.85], 7, { duration: 0.8 });
    }

    // 바깥 클릭 시 자동완성 닫기
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-section')) {
        document.getElementById("autocompleteList").style.display = "none";
      }
    });

    // 초기 실행
    drawBaseRivers();
    renderRiverList();
  </script>
</body>
</html>
